# Include inside the API server block. /run MUST be tmpfs, host swap disabled.
# Streaming avoids normal disk spooling; tmpfs also protects exceptional body buffering.
client_body_temp_path /run/privacyshield-nginx/body;
client_body_buffer_size 64k;
proxy_temp_path /run/privacyshield-nginx/proxy;
proxy_request_buffering off;
proxy_http_version 1.1;
proxy_buffering off;
proxy_ignore_headers X-Accel-Buffering;
proxy_max_temp_file_size 0;
proxy_cache off;
proxy_store off;
