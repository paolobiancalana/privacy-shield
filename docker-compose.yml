# privacy-shield/docker-compose.yml
# OVH sovereign-EU production and local integration stack.

version: "3.9"

services:
  privacy-shield:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      - PRIVACY_SHIELD_KEK_BASE64=${PRIVACY_SHIELD_KEK_BASE64}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TOKEN_TTL_SECONDS=${TOKEN_TTL_SECONDS:-60}
      - APP_VERSION=1.0.0
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No privileged mode needed — app runs as non-root (uid 1001)
    mem_limit: 1g
    memswap_limit: 1g
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy volatile-ttl
      --requirepass ${REDIS_PASSWORD:-changeme}
      --save ""
      --appendonly no
    memswap_limit: 128M
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /data
    # Redis not exposed to host by default — only reachable from privacy-shield service.
    # Uncomment below for local debugging:
    # ports:
    #   - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
