name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-app.txt
          pip install -r requirements-dev.txt

      - name: Install real Redis for isolated P0 acceptance tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server

      - name: Run tests
        env:
          PRIVACY_SHIELD_KEK_BASE64: ${{ secrets.TEST_KEK_BASE64 }}
          REDIS_URL: redis://localhost:6379
          ADMIN_API_KEY: test-admin-key
        run: |
          python -m pytest tests_app/ \
            --ignore=tests_app/adversarial/test_breach_fixes.py \
            --ignore=tests_app/integration/test_api_lifecycle.py \
            --ignore=tests_app/integration/test_metrics_endpoint.py \
            --ignore=tests_app/integration/test_api_key_auth.py \
            -q --tb=short

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact tested release to OVH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: paolo
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: deploy ${{ github.sha }}
